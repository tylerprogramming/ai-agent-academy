<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Chat Website</title>
    <script>
      window.chatkitLoadError = false;
      const script = document.createElement('script');
      script.src = 'https://cdn.platform.openai.com/deployments/chatkit/chatkit.js';
      script.onerror = function() {
        console.error('Failed to load ChatKit library from CDN');
        console.error('Script src:', script.src);
        window.chatkitLoadError = true;
      };
      script.onload = function() {
        console.log('ChatKit library loaded successfully');
        console.log('window.openai:', window.openai);
        console.log('window keys:', Object.keys(window).filter(k => k.toLowerCase().includes('chat') || k.toLowerCase().includes('openai')));
      };
      console.log('Loading ChatKit from:', script.src);
      document.head.appendChild(script);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
